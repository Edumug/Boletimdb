<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Abner Project</title>
    <link rel="stylesheet" href="login.css"/>
</head>

<body>

    <header>
        <img src="../imgs/Nightwing-logo.png" alt="" id="logo" />
        <h1>Boletim de Alunos</h1>
    </header>

    <main class="conteudo">

        <div id="esquerda">
          <h1>Bem vindo(a)! <br> Faça seu Login</h1>
        </div>
        <div id="direita">

            <div class="form">
                <h1>Login</h1>

                <input type="text" id="login" placeholder="Usuário" />

                <div class="senha-container">
                    <input type="password" id="senha" placeholder="Senha" />
                    <img id="btnMostrarSenha" src="../imgs/olho.png" alt="Mostrar Senha">
                </div>

                <button id="btnEntrar">Entrar</button>
            </div>

        </div>

    </main>

    <ul id="lista"></ul>

    <script type="module" src="login.js"></script>

</body>
</html>
