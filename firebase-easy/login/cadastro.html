<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - BoletimDB</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header>
    <img src="../imgs/Nightwing-logo.png" alt="" id="logo">
    <h1>Boletim de Alunos</h1>
  </header>

  <main class="conteudo">
    <div id="esquerda">
      <h1>Crie sua conta!<br>É rápido e fácil.</h1>
    </div>

    <div id="direita">
      <div class="form">
        <h1>Criar conta</h1>
        <input type="text" id="novoLogin" placeholder="Novo usuário">
        <input type="password" id="novaSenha" placeholder="Nova senha">
        <input type="password" id="confirmarSenha" placeholder="Confirmar senha">
        <button id="btnCriar">Criar conta</button>
        <button id="btnVoltar" type="button">Voltar para o login</button>
      </div>
    </div>
  </main>

  <script type="module" src="cadastro.js"></script>
</body>
</html>
