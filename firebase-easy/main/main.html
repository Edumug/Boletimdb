<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoletimDB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img id="logo" src="../imgs/Nightwing-logo.png" alt="BoletimDB">
    <div class="titulo-header">
      <h1>BoletimDB</h1>
      <p>Cadastro de alunos</p>
    </div>
    <div class="acoes-topo">
      <button id="btnTema" type="button">🌙</button>
      <button id="btnSair" type="button">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <section class="dashboard">
      <div class="card"><b id="totalAlunos">0</b><span>Alunos</span></div>
      <div class="card"><b id="totalAprovados">0</b><span>Aprovados</span></div>
      <div class="card"><b id="totalReprovados">0</b><span>Reprovados</span></div>
      <div class="card"><b id="mediaTurma">0,00</b><span>Média geral</span></div>
    </section>

    <section class="form">
      <input id="nome" type="text" placeholder="Nome" required>
      <input id="turma" type="text" placeholder="Turma" required>
      <input id="nota1" type="number" min="0" max="10" step="0.01" placeholder="Nota 1" required>
      <input id="nota2" type="number" min="0" max="10" step="0.01" placeholder="Nota 2" required>
      <input id="nota3" type="number" min="0" max="10" step="0.01" placeholder="Nota 3" required>
      <button id="btnSalvar" type="button">Salvar</button>
    </section>


    <h2>Alunos cadastrados</h2>
    <section class="filtro">
      <input id="busca" type="text" placeholder="Pesquisar aluno...">
      <select id="filtroTurma">
        <option value="">Todas as turmas</option>
      </select>
      <select id="ordenacao">
        <option value="nome-asc">Nome A-Z</option>
        <option value="nome-desc">Nome Z-A</option>
        <option value="media-desc">Maior média</option>
        <option value="media-asc">Menor média</option>
      </select>
    </section>
    <ul id="lista"></ul>
    <p id="semResultados" class="sem-resultados">Nenhum aluno encontrado.</p>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
