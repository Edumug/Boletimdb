<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abner Project</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>
  <header>
    <img src="../imgs/Nightwing-logo.png" alt="" id="logo" />
  <h1>Boletim de Alunos</h1>
  <button id="btnSair">Sair</button>
  </header>
  

  <div class="form">
    <input type="text" id="nome" placeholder="Nome do Aluno" />
    <input type="text" id="turma" placeholder="Turma" />
    <input type="number" id="nota1" placeholder="1º Nota" />
    <input type="number" id="nota2" placeholder="2º Nota" />
    <input type="number" id="nota3" placeholder="3º Nota" />
    <button id="btnSalvar">Salvar</button>
  </div>

  <div class="filtro">
    <input type="text" id="busca" placeholder="Buscar por nome" />
  </div>

  <ul id="lista"></ul>
  <script type="module" src="./main.js"></script>
</body>
</html>
